databaseChangeLog:
  - changeSet:
      id: 017-create-site-table
      author: sudheesh
      changes:
        - sql:
          sql: |
            CREATE TABLE sites (
                id SERIAL PRIMARY KEY,
                name VARCHAR(255) NOT NULL,
                created_at TIMESTAMP DEFAULT NOW(),
                updated_at TIMESTAMP DEFAULT NOW()
            );
      rollback:
        - sql:
          sql: |
            DROP TABLE sites;