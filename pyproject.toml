description = "Industrial Asset Management Platform using Aiohttp and React"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
    "aiohttp-apispec>=2.2.3",
    "aiohttp-devtools>=1.1.2",
    "alembic>=1.18.4",
    "apispec>=3.3.2",
    "asyncpg>=0.31.0",
    "marshmallow>=4.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0.49",
]
